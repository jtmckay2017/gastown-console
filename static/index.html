<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gas Town · Admin</title>
<!-- The one thing on this page the server fills in (server.py `_page()`), and the only
     reason it does: approving a plan starts an autonomous agent, so that control has to
     be ABSENT rather than disabled whenever the console is reachable from anything but
     this machine — and "absent" has to be checkable by fetching the page, not by
     squinting at it. `curl -s http://…/ | grep gt-dispatch` answers on or off. Off, the
     button is never built and POST /api/dispatch is a 404. See dispatch.py. -->
<meta name="gt-dispatch" content="__GT_DISPATCH__">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⛽</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">⛽</span>
    <div class="brand-text">
      <strong>Gas Town</strong>
      <span id="town-name" class="muted">—</span>
    </div>
  </div>

  <div class="services" id="services"></div>

  <div class="topbar-actions">
    <!-- These three lose their labels on a phone (.btn-label), so they carry their names
         in aria-label rather than leaning on `title=` — a tooltip is a mouse affordance
         and the phone is where the label is gone. -->
    <button id="refresh" class="btn" title="Refresh now" aria-label="Refresh now">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      <span class="btn-label">Refresh</span>
    </button>
    <label class="toggle" title="Auto-refresh every 8 seconds">
      <input type="checkbox" id="auto" checked><span class="track"></span>
      <span class="toggle-label">Auto</span>
    </label>
    <button id="theme" class="btn icon-only" title="Toggle theme" aria-label="Toggle light and dark theme">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab is-active" data-view="overview">Overview</button>
  <button class="tab" data-view="work">Work <span class="pill" id="pill-work">0</span></button>
  <button class="tab" data-view="board">Board <span class="pill" id="pill-board">0</span></button>
  <button class="tab" data-view="backlog">Backlog <span class="pill" id="pill-backlog">0</span></button>
  <button class="tab" data-view="agents">Agents <span class="pill" id="pill-agents">0</span></button>
  <button class="tab" data-view="mail">Mail <span class="pill" id="pill-mail">0</span></button>
  <button class="tab" data-view="activity">Activity</button>
</nav>

<main>
  <section class="view is-active" id="view-overview">
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <article class="card span-2">
        <header class="card-head"><h2>Rigs</h2><span class="muted" id="rig-count"></span></header>
        <div id="rigs" class="card-body stack"></div>
      </article>
      <article class="card">
        <header class="card-head"><h2>Escalations</h2></header>
        <div id="escalations" class="card-body"></div>
      </article>
      <article class="card">
        <header class="card-head"><h2>Work by priority</h2></header>
        <div id="prio" class="card-body"></div>
      </article>
      <article class="card span-2">
        <header class="card-head"><h2>Recently closed</h2></header>
        <div id="changelog" class="card-body scroll-y stack"></div>
      </article>
    </div>
  </section>

  <section class="view" id="view-work">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="work-q" type="search" placeholder="Filter by title, id or source…" autocomplete="off">
      </div>
      <div class="chips" id="work-chips"></div>
    </div>
    <!-- What is happening now, then how far along it is, then what could be next.
         The filters above apply to all three. -->
    <div class="section">
      <h2 class="section-head">In flight <span class="muted" id="flight-count"></span></h2>
      <div id="flight" class="stack"></div>
    </div>
    <div class="section">
      <h2 class="section-head">Convoys <span class="muted" id="convoy-count"></span></h2>
      <div id="convoys" class="stack"></div>
    </div>
    <div class="section">
      <h2 class="section-head">Ready <span class="muted" id="ready-count"></span></h2>
      <div id="work" class="stack"></div>
    </div>
  </section>

  <!-- The same beads as the Backlog tab, arranged as the state machine they actually
       are: columns are beads' own statuses (never a vocabulary of ours), swimlanes are
       the parent-child edges, and a card that cannot move says what is holding it. The
       pane on the right is the focused half — one card's gathered context, proposed
       plan and acceptance criteria, which is the argument behind the card rather than
       a longer version of its title.
       It is also the one place this console writes to a plan: the pane can draft a
       bead, edit one, link two, and mail an agent to go and revise it — see edit.py.
       On a console bound to the loopback it can also approve a plan and put an agent
       on it, which is the one write here that starts something rather than describing
       it; that control is absent entirely anywhere else (dispatch.py). Nothing on this
       tab deletes or closes anything, anywhere. -->
  <section class="view" id="view-board">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="board-q" type="search" placeholder="Filter by title, id, type or assignee…" autocomplete="off">
      </div>
      <div class="chips" id="board-chips"></div>
      <button id="board-new" class="btn primary">
        <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">New bead</span>
      </button>
    </div>
    <div class="board-layout" id="board-layout">
      <div class="board-main">
        <div class="board-meta muted" id="board-meta"></div>
        <div id="board" class="board"></div>
      </div>
      <aside class="board-pane" id="board-pane" aria-label="Planning pane"></aside>
    </div>
  </section>

  <!-- The Work tab is about this minute. This one is about the plan behind it, which
       is what a standup, a planning session or a retro is actually reading: the epics
       and what sits under them, what is stuck and behind what, and why each finished
       thing finished. One rig at a time, because that is how a ceremony is run. -->
  <section class="view" id="view-backlog">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="backlog-q" type="search" placeholder="Filter by title, id, type or assignee…" autocomplete="off">
      </div>
      <div class="chips" id="backlog-chips"></div>
    </div>
    <div class="kpis" id="backlog-kpis"></div>
    <div class="grid">
      <article class="card">
        <header class="card-head"><h2>By status</h2></header>
        <div id="backlog-status" class="card-body"></div>
      </article>
      <article class="card">
        <header class="card-head"><h2>By type</h2></header>
        <div id="backlog-type" class="card-body"></div>
      </article>
      <article class="card">
        <header class="card-head"><h2>Coverage</h2><span class="muted" id="backlog-coverage"></span></header>
        <div id="backlog-rigs" class="card-body"></div>
      </article>
    </div>
    <!-- The same beads as the sections below, drawn rather than listed. The pictures
         are generated on the server (graph.py) and arrive as SVG inside the backlog
         panel, so they are always the same read as the lists under them. -->
    <div class="section">
      <h2 class="section-head">Map <span class="muted" id="map-count"></span></h2>
      <div id="map" class="stack"></div>
    </div>
    <div class="section">
      <h2 class="section-head">Epics <span class="muted" id="epic-count"></span></h2>
      <div id="epics" class="stack"></div>
    </div>
    <div class="section">
      <h2 class="section-head">Blocked <span class="muted" id="blocked-count"></span></h2>
      <div id="blocked" class="stack"></div>
    </div>
    <div class="section">
      <h2 class="section-head">In progress <span class="muted" id="progress-count"></span></h2>
      <div id="backlog-flight" class="stack"></div>
    </div>
    <div class="section">
      <h2 class="section-head">Closed <span class="muted" id="closed-count"></span></h2>
      <div id="closed" class="stack"></div>
    </div>
  </section>

  <section class="view" id="view-agents">
    <div id="agents" class="stack"></div>
  </section>

  <section class="view" id="view-mail">
    <article class="card compose">
      <header class="card-head"><h2>Send to an agent</h2></header>
      <div class="card-body">
        <div class="field-row">
          <label class="field">
            <span>To</span>
            <input id="m-to" list="agent-addresses" placeholder="mayor/" autocomplete="off">
            <datalist id="agent-addresses"></datalist>
          </label>
          <label class="field narrow">
            <span>Type</span>
            <select id="m-type">
              <option value="notification">notification</option>
              <option value="task">task</option>
              <option value="scavenge">scavenge</option>
            </select>
          </label>
          <label class="field narrow">
            <span>Priority</span>
            <select id="m-priority">
              <option value="0">0 urgent</option>
              <option value="1">1 high</option>
              <option value="2" selected>2 normal</option>
              <option value="3">3 low</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>Subject</span>
          <input id="m-subject" placeholder="One line — what this is about">
        </label>
        <label class="field">
          <span>Message</span>
          <div class="textarea-wrap">
            <textarea id="m-body" rows="6" placeholder="Dictate with the mic, or use your keyboard's dictation key…"></textarea>
            <button id="mic" class="mic" title="Dictate" aria-label="Dictate the message">
              <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
            </button>
          </div>
        </label>
        <div class="compose-foot">
          <span id="m-status" class="muted"></span>
          <button id="m-send" class="btn primary">Send</button>
        </div>
      </div>
    </article>
    <div id="mail" class="stack"></div>
  </section>

  <section class="view" id="view-activity">
    <div id="trail" class="stack"></div>
  </section>
</main>

<footer class="statusbar">
  <span id="updated" class="muted">loading…</span>
  <span class="muted sep">·</span>
  <span class="muted" id="write-note">read-only except mail and the Board tab's bead editor — no delete</span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
